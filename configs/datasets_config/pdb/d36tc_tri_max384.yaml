# D36tc: the 34 bad_afdb targets + their D36m date-clean structural hits, as an EVAL set for the ConFind
# tri (cfft). Clone of pdb_train_contact-confind-synthtopo_S25_max384_purge-test_cutoff-190828.yaml. Changed keys:
#   data_dir (datamodule, dataselector, datasplitter) -> the D36tc dir; pack_path and eligible_ids_file removed;
#   SequenceDropoutTransform prob 0; TopologyReferenceTransform index_path -> the D36tc index (same synthetic
#   8-feature format, natives only, cfft index stats), sigma_frac/mutate_prob/type_mutate_prob/token_mask_prob/
#   drop_prob 0; dataselector min_length 40 / max_length 700 (D36m window, hit rows survive selection; queries
#   come from fixed_chain_list only); datasplitter train_val_test [0.8, 0.2, 0.0], exclude_ids_from_file null,
#   drop_ids_from_file null. Everything else identical.
datamodule:
  _target_: "proteinfoundation.datasets.pdb_data.PDBLightningDataModule"
  data_dir: /orcd/pool/006/chenxiou/d36tc/data/
  in_memory: False
  format: "cif"
  overwrite: False
  regenerate_missing: True
  batch_padding: True
  sampling_mode: "cluster-random"
  cath_code_dir: ${oc.env:DATA_PATH}/cath_shared/
  multilabel_mode: "sample"
  transforms:
    - _target_: "proteinfoundation.datasets.transforms.GlobalRotationTransform"
    - _target_: "proteinfoundation.datasets.transforms.ChainBreakPerResidueTransform"
    - _target_: "proteinfoundation.datasets.transforms.CATHLabelTransform"
      root_dir: ${oc.env:DATA_PATH}/cathdata/
    - _target_: "proteinfoundation.datasets.transforms.CATHToIndicesTransform"
      cath_code_dir: ${oc.env:DATA_PATH}/cath_shared/
    - _target_: "proteinfoundation.datasets.transforms.DSSPTargetTransform"
    - _target_: "proteinfoundation.datasets.transforms.ContactMapTransform"
      contact_method: confind
      confind_rotamer_lib: ${oc.env:DATA_PATH}/rotlibs
      confind_contact_threshold: 0.01
    - _target_: "proteinfoundation.datasets.transforms.SequenceDropoutTransform"
      prob: 0.0                      # D36tc: never drop (sampling ignores the flag; the val-loss batch would not)
    - _target_: "proteinfoundation.datasets.topology_reference.TopologyReferenceTransform"
      index_path: /orcd/pool/006/chenxiou/d36tc/data/topology_index_d36tc.pt
      reference_source: synthetic    # same index format as training; natives only, so forward() masks and sampling uses self_reference
      tm_range: [0.5, 0.9]
      sse_types: [1, 2]
      max_topology_len: 128
      max_topology_he_len: 64
      sigma_frac: 0.0                # D36tc: no augmentation
      mutate_prob: 0.0
      type_mutate_prob: 0.0
      token_mask_prob: 0.0
      drop_prob: 0.0
      drop_ref_len_range: [5, 39]
      self_fallback: True
      min_len: 1
    - _target_: "proteinfoundation.datasets.transforms.PaddingTransform"
      max_size: 384
  batch_size: 1
  num_workers: 8
  pin_memory: True
  prefetch_factor: 2

  dataselector:
    _target_: "proteinfoundation.datasets.pdb_data.PDBDataSelector"
    data_dir: /orcd/pool/006/chenxiou/d36tc/data/
    fraction: 1
    molecule_type: "protein"
    experiment_types: ["diffraction", "EM"]
    min_length: 40                   # D36m window: hit rows (41..673 residues) must survive selection
    max_length: 700
    oligomeric_min: null
    oligomeric_max: null
    best_resolution: 0.0
    worst_resolution: 5.0
    has_ligands: []
    remove_ligands: []
    remove_non_standard_residues: True
    remove_pdb_unavailable: True
    max_deposition_date: "2019-08-28"
    exclude_ids: []

  datasplitter:
    _target_: "proteinfoundation.datasets.pdb_data.PDBDataSplitter"
    data_dir: /orcd/pool/006/chenxiou/d36tc/data/
    train_val_test: [0.8, 0.2, 0.0]  # D36m: both splits non-empty (index builder path resolver + trainer.validate needs a val batch)
    split_type: "sequence_similarity"
    split_sequence_similarity: 0.25
    overwrite_sequence_clusters: False
    exclude_ids: []
    exclude_ids_from_file: null
    drop_ids_from_file: null
