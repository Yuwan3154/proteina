# ConFind TopoRef with fixed 9-residue ProteinMPNN chunk featurization + template sequence input (25% i.i.d. masking),
# trained on 4x RTX A6000 (effective batch 32 = 4 GPUs x batch_size 1 x accumulate_grad_batches 8) with
# tmalign_smooth secondary structure labels.
run_name_: tri_v2_confind_mpnn_chunk9_seq25

hardware:
  ncpus_per_task_train_: 4    # dataloader workers PER RANK (4 ranks -> 16 workers)
  ncpus_per_task_prepro_: 8
  accelerator: gpu
  ngpus_per_node_: 4
  nnodes_: 1

loss:
  t_distribution:
    name: logit-normal
    p1: 0.0
    p2: 1.0
  loss_t_clamp: 0.9
  use_aux_loss: True
  aux_loss_t_lim: 0.3
  thres_aux_2d_loss: 0.6
  aux_loss_weight: 1.0
  num_dist_buckets: 39
  distogram_min_bin: 0.325
  distogram_max_bin: 5.075
  align_loss: softmax
  align_loss_weight: ${oc.env:ALIGN_W,0.3}
  mlm_loss_weight: ${oc.env:MLM_W,0.0}

defaults:
  - model: contactflow
  - override model/nn: contact_map_tri_v2_mpnn_chunk9
  - _self_

model:
  nn:
    pair_ref_features: both

dataset: pdb_train_contact-confind-synthtopo_S25_max384_mpnn_chunk9
dataset_config_subdir: pdb

force_precision_f32: False

training:
  self_cond: True
  seq_cond: True
  fold_cond: True
  mask_T_prob: 0.5
  mask_A_prob: 0.5
  mask_C_prob: 0.5
  fold_label_sample_ratio: [0.5, 0.1, 0.15, 0.25]
  mask_seq_proportion: 0.1
  finetune_seq_cond_lora_only: False
  contact_map_coord_loss_weight: 0.0

lora:
  use: False
  lora_alpha: 32.0
  lora_dropout: 0.0
  r: 0
  train_bias: "none"

opt:
  lr: 0.0001
  max_epochs: 1000
  max_steps: -1
  accumulate_grad_batches: 8
  val_check_interval_optim_steps: 50
  limit_val_batches: 64
  skip_nan_grad: False
  grad_and_weight_analysis: False
  dist_strategy: ddp
  dist_timeout_s: 3600
  dist_backend: nccl
  use_lr_warmup: True
  warmup_steps: 1000
  warmup_start_lr_ratio: 0.0
  lr_scheduler_type: "cosine"

log:
  wandb_project: protein_transformer_big_runs
  log_wandb: True
  log_every_n_steps: 100
  single_step_metrics_every_n_steps: 100
  log_structure_every_n_steps: 100
  checkpoint_best_tmscore_median: False
  checkpoint: True
  checkpoint_best_contact_precision: True
  checkpoint_best_contact_save_top_k: 5
  checkpoint_every_n_steps: 50
  last_ckpt_every_n_steps: 50

validation_sampling:
  topology_nonself: True
  topology_nonself_seed: 0
  dt: 0.02
  sampling_mode: sc
  sc_scale_noise: 0.45
  tmscore_n_samples: 4
  tmscore_every_n_val_epochs: 20
  tmscore_mode: 5
  fixed_chain_list: ${oc.env:VAL_FIXED_LIST,/home/jupyter-chenxi/sse1d_data/orcd/scratch/orcd/011/chenxiou/valset_analysis/val_fixed32_max256.txt}

seed: 42

ema:
  decay: 0.999
  validate_original_weights: False
  every_n_steps: 1
  cpu_offload: False
